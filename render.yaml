services:
  - type: web
    name: echomind-api-0i0icci
    runtime: node
    autoDeploy: true
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: PORT
        value: 10000
